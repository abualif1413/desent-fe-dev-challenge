<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft ground plane radial contact shadow -->
    <radialGradient id="lamp-ground-shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25" />
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Warm/Neutral Architectural LED Light Glow Cone -->
    <linearGradient id="lamp-illumination-beam" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="25%" stop-color="#f8fafc" stop-opacity="0.12" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Brushed Aluminum / Light Anodized Alloy Gradient -->
    <linearGradient id="metal-alloy-brushed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Vertical Stem Shaft Metallic Gradient -->
    <linearGradient id="stem-vertical-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="20%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Horizontal Light Bar Anodized Hood Gradient -->
    <linearGradient id="lightbar-hood-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Base Plate Top Surface Gradient (Sleek beveled architectural disc) -->
    <linearGradient id="base-disc-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="90%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Base Plate Lower Chamfer Lip Gradient -->
    <linearGradient id="base-disc-lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- LED Diffuser Lens Surface (High-CRI 4000K Architectural Glow) -->
    <linearGradient id="diffuser-lens-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="20%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Signature Precision Cyan Accent Glow (Matching monitor, desk, chair series) -->
    <linearGradient id="cyan-precision-ribbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Rotary Knurling Pattern on Articulation Knobs -->
    <pattern id="knurled-dial" width="3" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="3" y2="3" stroke="#64748b" stroke-width="0.6" />
      <line x1="3" y1="0" x2="0" y2="3" stroke="#475569" stroke-width="0.6" />
    </pattern>
  </defs>

  <!-- 1. Ambient Light Projection Beam (Downward architectural task lighting) -->
  <polygon points="120,118 480,118 550,505 50,505" fill="url(#lamp-illumination-beam)" />

  <!-- 2. Ground Plane Contact Shadow -->
  <ellipse cx="300" cy="510" rx="145" ry="15" fill="url(#lamp-ground-shadow)" />
  <ellipse cx="300" cy="508" rx="85" ry="7" fill="#0f172a" fill-opacity="0.16" />
  <ellipse cx="300" cy="507" rx="55" ry="4" fill="#0f172a" fill-opacity="0.22" />

  <!-- 3. Base Assembly (Precision Architectural Weighted Disc with Touch Controls) -->
  <g id="lamp-base">
    <!-- Base Plate Bottom Rim / Drop Shadow Bevel -->
    <path d="M 210 503 C 210 496, 250 492, 300 492 C 350 492, 390 496, 390 503 L 390 506 C 390 511, 350 515, 300 515 C 250 515, 210 511, 210 506 Z"
          fill="url(#base-disc-lip)" stroke="#64748b" stroke-width="0.75" />

    <!-- Base Plate Top Surface (Sleek beveled elliptical disc) -->
    <ellipse cx="300" cy="502" rx="90" ry="11" fill="url(#base-disc-surface)" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Top Specular Rim Chamfer -->
    <ellipse cx="300" cy="501" rx="88" ry="9.5" fill="none" stroke="#ffffff" stroke-width="1.25" stroke-opacity="0.9" />

    <!-- Integrated Capacitive Touch Control Strip (Brightness & Color Temperature) -->
    <!-- Capacitive Slider Trough -->
    <rect x="264" y="503" width="72" height="3" rx="1.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5" />
    <!-- Active Level Indicator (Precision Cyan LED slider dot) -->
    <rect x="264" y="503" width="46" height="3" rx="1.5" fill="url(#cyan-precision-ribbon)" />
    <circle cx="310" cy="504.5" r="2.2" fill="#38bdf8" />
    <circle cx="310" cy="504.5" r="4" fill="#38bdf8" fill-opacity="0.25" />

    <!-- Power / CCT Touch Sensor Marks -->
    <circle cx="252" cy="504.5" r="2.2" fill="#94a3b8" />
    <circle cx="348" cy="504.5" r="2.2" fill="#0284c7" />

    <!-- Swivel Collar Hub at Base of Riser -->
    <rect x="286" y="478" width="28" height="18" rx="3" fill="url(#metal-alloy-brushed)" stroke="#64748b" stroke-width="0.75" />
    <ellipse cx="300" cy="478" rx="14" ry="3.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
    <line x1="289" y1="487" x2="311" y2="487" stroke="#cbd5e1" stroke-width="1" />
  </g>

  <!-- 4. Articulated Dual-Bar Riser Column (Architectural Twin-Shaft Geometry) -->
  <g id="vertical-column-assembly">
    <!-- Twin Brushed Aluminum Upright Columns (Left and Right balanced structural pillars) -->
    <!-- Left Column Pillar -->
    <rect x="287" y="195" width="10" height="284" rx="2" fill="url(#stem-vertical-gradient)" stroke="#64748b" stroke-width="0.75" />
    <line x1="292" y1="196" x2="292" y2="478" stroke="#ffffff" stroke-width="1.25" stroke-opacity="0.8" />

    <!-- Right Column Pillar -->
    <rect x="303" y="195" width="10" height="284" rx="2" fill="url(#stem-vertical-gradient)" stroke="#64748b" stroke-width="0.75" />
    <line x1="308" y1="196" x2="308" y2="478" stroke="#ffffff" stroke-width="1.25" stroke-opacity="0.8" />

    <!-- Recessed Architectural Cable Channel between pillars -->
    <rect x="298" y="205" width="4" height="268" fill="#1e293b" fill-opacity="0.35" />

    <!-- Laser-Etched Height & Angle Calibration Indices (Technical CAD detail matching monitor/desk) -->
    <g id="calibration-ticks" stroke="#64748b" stroke-width="0.75">
      <line x1="284" y1="310" x2="287" y2="310" />
      <line x1="283" y1="325" x2="287" y2="325" />
      <line x1="284" y1="340" x2="287" y2="340" />
      <line x1="281" y1="355" x2="287" y2="355" stroke="#0284c7" stroke-width="1.2" />
      <line x1="284" y1="370" x2="287" y2="370" />
      <line x1="283" y1="385" x2="287" y2="385" />
    </g>

    <!-- Structural Stabilizer Cross-Braces -->
    <!-- Mid Brace -->
    <rect x="285" y="326" width="30" height="8" rx="2" fill="url(#metal-alloy-brushed)" stroke="#64748b" stroke-width="0.75" />
    <circle cx="292" cy="330" r="1.5" fill="#cbd5e1" stroke="#475569" stroke-width="0.5" />
    <circle cx="308" cy="330" r="1.5" fill="#cbd5e1" stroke="#475569" stroke-width="0.5" />

    <!-- Lower Brace with Signature Cyan Alignment Mark -->
    <rect x="285" y="420" width="30" height="8" rx="2" fill="url(#metal-alloy-brushed)" stroke="#64748b" stroke-width="0.75" />
    <line x1="294" y1="424" x2="306" y2="424" stroke="#0284c7" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- 5. Dual-Axis Articulated Pivot Head Assembly -->
  <g id="pivot-hinge-assembly">
    <!-- Main Pivot Bracket Casting -->
    <path d="M 280 180 L 320 180 C 324 180, 326 184, 326 188 L 324 204 C 324 208, 320 211, 316 211 L 284 211 C 280 211, 276 208, 276 204 L 274 188 C 274 184, 276 180, 280 180 Z"
          fill="url(#metal-alloy-brushed)" stroke="#64748b" stroke-width="0.8" />

    <!-- Precision Dual-Axis Rotating Cylindrical Hub -->
    <rect x="272" y="166" width="56" height="18" rx="4" fill="url(#stem-vertical-gradient)" stroke="#475569" stroke-width="0.8" />
    <line x1="274" y1="175" x2="326" y2="175" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />

    <!-- Knurled Adjustment Tension Dial (Left side) -->
    <rect x="264" y="168" width="8" height="14" rx="2" fill="url(#knurled-dial)" stroke="#475569" stroke-width="0.75" />
    <circle cx="268" cy="175" r="1.5" fill="#cbd5e1" />

    <!-- Knurled Adjustment Tension Dial (Right side) -->
    <rect x="328" y="168" width="8" height="14" rx="2" fill="url(#knurled-dial)" stroke="#475569" stroke-width="0.75" />
    <circle cx="332" cy="175" r="1.5" fill="#cbd5e1" />

    <!-- Vertical Linkage Extension to Lamp Hood -->
    <rect x="293" y="126" width="14" height="42" rx="2" fill="url(#stem-vertical-gradient)" stroke="#64748b" stroke-width="0.75" />
    <line x1="300" y1="128" x2="300" y2="166" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Hood Swivel Ball Joint Collar -->
    <rect x="288" y="120" width="24" height="8" rx="2" fill="#64748b" stroke="#475569" stroke-width="0.75" />
    <circle cx="300" cy="124" r="1.75" fill="#38bdf8" />
  </g>

  <!-- 6. Architectural Ultra-Slim Horizontal LED Light Bar (Direct Front Elevation) -->
  <g id="led-lamp-head">
    <!-- Upper Structural Anodized Aluminum Hood -->
    <!-- Tapered aerodynamic linear profile engineered for glare-free screen & desk drafting -->
    <path d="M 88 102
             C 94 95, 108 92, 126 92
             L 474 92
             C 492 92, 506 95, 512 102
             L 516 114
             C 516 116, 514 118, 510 118
             L 90 118
             C 86 118, 84 116, 84 114 Z"
          fill="url(#lightbar-hood-gradient)"
          stroke="#64748b"
          stroke-width="1.25" />

    <!-- Hood Top Specular Bevel Highlight Line -->
    <path d="M 126 93.5 L 474 93.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Left & Right Die-Cast Endcaps -->
    <path d="M 88 102 L 94 96 L 90 118 L 84 114 Z" fill="#94a3b8" stroke="#64748b" stroke-width="0.75" />
    <path d="M 512 102 L 506 96 L 510 118 L 516 114 Z" fill="#64748b" stroke="#475569" stroke-width="0.75" />

    <!-- Front Edge Face (Thickness Chamfer) -->
    <rect x="88" y="112" width="424" height="6.5" rx="1.5" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.6" />
    <line x1="89" y1="113" x2="511" y2="113" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

    <!-- Signature Precision Cyan Accent Strip (Embedded along the lamp hood apex) -->
    <rect x="230" y="104" width="140" height="2" rx="1" fill="url(#cyan-precision-ribbon)" />
    <!-- Ambient Light Sensor (Auto-dimming studio lux sensor) -->
    <circle cx="300" cy="100" r="1.8" fill="#1e293b" stroke="#64748b" stroke-width="0.5" />
    <circle cx="300" cy="100" r="0.9" fill="#0284c7" />

    <!-- 7. High-CRI LED Diffuser Lens Panel (Underside Glowing Surface) -->
    <rect x="94" y="117.5" width="412" height="5" rx="1.5" fill="url(#diffuser-lens-glow)" stroke="#e0f2fe" stroke-width="0.5" />

    <!-- High-Luminance Micro LED Optical Core Strip -->
    <line x1="102" y1="120" x2="498" y2="120" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Ambient Blue/Cyan Micro Halo -->
    <line x1="115" y1="121" x2="485" y2="121" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
</svg>