<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft ground plane contact shadow -->
    <radialGradient id="curve-ground-shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Brushed Aluminum Stand Shaft -->
    <linearGradient id="metal-stand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Base Plate Curved / Winged Aluminum Gradient -->
    <linearGradient id="curved-base-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Curved Display Outer Bezel / Housing Gradient (Subtle depth from outer swept edges toward center) -->
    <linearGradient id="curve-chassis-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="15%" stop-color="#334155" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="85%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Curved Bottom Chin Aluminum Trim Gradient -->
    <linearGradient id="chin-curve-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Ultra-Wide Curved Display Screen Background Gradient -->
    <linearGradient id="curved-screen-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c142b" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Curved Anti-Glare Ambient Sheen (Parabolic lighting reflection highlighting 1800R/1500R curvature) -->
    <linearGradient id="curve-reflection-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="curve-reflection-right" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Cyan Accent Glow -->
    <linearGradient id="cyan-precision-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Technical Architectural Grid for Ultra-Wide Screen -->
    <pattern id="cad-grid-ultrawide" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#0284c7" stroke-width="0.45" stroke-opacity="0.1" />
      <circle cx="18" cy="18" r="0.65" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Front micro-speaker perforation pattern -->
    <pattern id="curve-grille" width="3.5" height="3.5" patternUnits="userSpaceOnUse">
      <circle cx="1.75" cy="1.75" r="0.6" fill="#475569" fill-opacity="0.6" />
    </pattern>
  </defs>

  <!-- 1. Ground Plane Contact Shadows (Extended for wide curved stance) -->
  <ellipse cx="320" cy="462" rx="195" ry="16" fill="url(#curve-ground-shadow)" />
  <ellipse cx="320" cy="460" rx="115" ry="7" fill="#0f172a" fill-opacity="0.16" />
  <ellipse cx="320" cy="459" rx="75" ry="4" fill="#0f172a" fill-opacity="0.25" />

  <!-- Foot Contact Tips Shadows for curved legs -->
  <ellipse cx="210" cy="459" rx="18" ry="4.5" fill="#0f172a" fill-opacity="0.28" />
  <ellipse cx="430" cy="459" rx="18" ry="4.5" fill="#0f172a" fill-opacity="0.28" />

  <!-- 2. Ergonomic Articulated Stand & Architectural Swept Base -->
  <g id="stand-assembly">
    <!-- Swept Architectural Base Wings (Engineered for ultra-wide curved center-of-gravity) -->
    <g id="base-swept-wings">
      <!-- Wing base lower rim/bevel shadow -->
      <path d="M 198 458 C 240 451, 290 448, 320 448 C 350 448, 400 451, 442 458 C 445 458.5, 448 456, 446 453 L 434 445 C 432 443.5, 428 444, 425 444.5 C 388 440, 345 438, 320 438 C 295 438, 252 440, 215 444.5 C 212 444, 208 443.5, 206 445 L 194 453 C 192 456, 195 458.5, 198 458 Z"
            fill="#94a3b8" stroke="#64748b" stroke-width="0.75" />

      <!-- Top Brushed Aluminum Surface -->
      <path d="M 200 456 C 242 449, 290 446, 320 446 C 350 446, 398 449, 440 456 C 442 456.5, 444 454.5, 443 452.5 L 431 444 C 429 442.5, 426 443, 423 443.5 C 386 439, 345 437, 320 437 C 295 437, 254 439, 217 443.5 C 214 443, 211 442.5, 209 444 L 197 452.5 C 196 454.5, 198 456.5, 200 456 Z"
            fill="url(#curved-base-surface)" stroke="#cbd5e1" stroke-width="0.75" />

      <!-- Swept Wing Specular Highlight Line -->
      <path d="M 202 455 C 244 448, 290 445.5, 320 445.5 C 350 445.5, 396 448, 438 455"
            stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

      <!-- Low-profile leveling glide tips -->
      <rect x="195" y="455" width="8" height="3" rx="1.5" fill="#475569" />
      <rect x="437" y="455" width="8" height="3" rx="1.5" fill="#475569" />
      <circle cx="320" cy="442" r="1.5" fill="#0284c7" />
    </g>

    <!-- Heavy-Duty Brushed Aluminum Vertical Riser Column -->
    <g id="stand-column">
      <!-- Main Upright Shaft -->
      <rect x="300" y="215" width="40" height="225" rx="3.5" fill="url(#metal-stand)" stroke="#94a3b8" stroke-width="0.8" />

      <!-- Center Specular Highlight Line -->
      <line x1="320" y1="216" x2="320" y2="438" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.85" />
      <!-- Subtle side contour shade -->
      <line x1="303" y1="216" x2="303" y2="438" stroke="#64748b" stroke-width="1" stroke-opacity="0.45" />

      <!-- Technical Height Adjustment Gauge Markings -->
      <line x1="310" y1="365" x2="315" y2="365" stroke="#64748b" stroke-width="0.75" />
      <line x1="308" y1="375" x2="315" y2="375" stroke="#64748b" stroke-width="0.75" />
      <line x1="310" y1="385" x2="315" y2="385" stroke="#64748b" stroke-width="0.75" />
      <line x1="307" y1="395" x2="315" y2="395" stroke="#0284c7" stroke-width="1.2" />
      <line x1="310" y1="405" x2="315" y2="405" stroke="#64748b" stroke-width="0.75" />

      <!-- Ergonomic Cable Pass-Through Grommet (Recessed ellipse) -->
      <ellipse cx="320" cy="325" rx="9" ry="17" fill="#475569" stroke="#334155" stroke-width="1" />
      <ellipse cx="320" cy="325" rx="7" ry="15" fill="#0f172a" />
      <path d="M 313 325 C 313 313, 327 313, 327 325" stroke="#1e293b" stroke-width="1.5" fill="none" />

      <!-- Heavy-Duty Curved Pivot Bracket Collar -->
      <rect x="294" y="222" width="52" height="20" rx="2.5" fill="#64748b" stroke="#475569" stroke-width="0.8" />
      <circle cx="301" cy="232" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" />
      <circle cx="339" cy="232" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" />
    </g>
  </g>

  <!-- 3. Ultra-Wide Curved UHD Display Screen (21:9 / 34-inch Curvature Elevation) -->
  <!-- Curvature geometry: Outer edges sweep slightly forward and downward in authentic front projection (1800R / 1500R curve arc) -->
  <g id="curved-display-assembly">
    <!-- Curved Chassis Outer Housing Frame -->
    <!-- Top Arc dips subtly in center; Bottom Arc sweeps in parallax creating curved depth -->
    <path d="M 28 62
             C 120 74, 220 80, 320 80
             C 420 80, 520 74, 612 62
             C 618 62, 622 66, 622 72
             L 622 328
             C 622 334, 618 338, 612 339
             C 520 351, 420 357, 320 357
             C 220 357, 120 351, 28 339
             C 22 338, 18 334, 18 328
             L 18 72
             C 18 66, 22 62, 28 62 Z"
          fill="url(#curve-chassis-gradient)"
          stroke="#475569"
          stroke-width="1.5" />

    <!-- Chassis Upper Edge Specular Curvature Highlight -->
    <path d="M 26 63
             C 120 75, 220 81, 320 81
             C 420 81, 520 75, 614 63"
          stroke="#ffffff"
          stroke-width="1"
          stroke-opacity="0.45"
          fill="none" />

    <!-- Curved Bottom Chin Bar (Architectural Brushed Anodized Aluminum) -->
    <path d="M 18 324
             C 120 336, 220 342, 320 342
             C 420 342, 520 336, 622 324
             L 622 338
             C 622 344, 618 348, 612 349
             C 520 361, 420 367, 320 367
             C 220 367, 120 361, 28 349
             C 22 348, 18 344, 18 338 Z"
          fill="url(#chin-curve-gradient)"
          stroke="#64748b"
          stroke-width="0.8" />

    <!-- Chin Bar Crisp Top Bevel Specular Line -->
    <path d="M 19 325
             C 120 337, 220 343, 320 343
             C 420 343, 520 337, 621 325"
          stroke="#ffffff"
          stroke-width="1.5"
          fill="none" />

    <!-- Chin Bar Signature Precision Cyan LED Accent Ribbon & Status Light -->
    <path d="M 240 353
             C 270 355.5, 370 355.5, 400 353"
          stroke="url(#cyan-precision-accent)"
          stroke-width="2.5"
          stroke-linecap="round"
          fill="none" />

    <!-- Power / Active LED Indicator -->
    <circle cx="598" cy="341" r="1.8" fill="#38bdf8" />
    <circle cx="598" cy="341" r="3.6" fill="#38bdf8" fill-opacity="0.25" />

    <!-- Integrated Micro-Speaker Stereo Grilles on Chin -->
    <rect x="65" y="337" width="110" height="4.5" rx="1" fill="url(#curve-grille)" />
    <rect x="465" y="337" width="110" height="4.5" rx="1" fill="url(#curve-grille)" />

    <!-- Curved Active Anti-Glare Display Area (21:9 Ultra-Wide) -->
    <g id="curved-active-screen">
      <!-- Screen Area Path -->
      <path id="curve-screen-clip-path"
            d="M 26 70
               C 120 82, 220 88, 320 88
               C 420 88, 520 82, 614 70
               L 614 322
               C 520 334, 420 340, 320 340
               C 220 340, 120 334, 26 322 Z"
            fill="url(#curved-screen-bg)"
            stroke="#060913"
            stroke-width="1" />

      <!-- Architectural CAD & Spatial Studio UI on Curved Screen -->
      <!-- Ultra-Wide Blueprint Grid -->
      <path d="M 26 70
               C 120 82, 220 88, 320 88
               C 420 88, 520 82, 614 70
               L 614 322
               C 520 334, 420 340, 320 340
               C 220 340, 120 334, 26 322 Z"
            fill="url(#cad-grid-ultrawide)" />

      <!-- Top Studio Navigation Bar (Following Subtle Curvature) -->
      <path d="M 26 70
               C 120 82, 220 88, 320 88
               C 420 88, 520 82, 614 70
               L 614 93
               C 520 105, 420 111, 320 111
               C 220 111, 120 105, 26 93 Z"
            fill="#0b1329"
            fill-opacity="0.88" />

      <!-- Traffic Light Controls -->
      <circle cx="42" cy="83" r="3" fill="#ef4444" fill-opacity="0.85" />
      <circle cx="52" cy="84" r="3" fill="#f59e0b" fill-opacity="0.85" />
      <circle cx="62" cy="85" r="3" fill="#10b981" fill-opacity="0.85" />

      <!-- File Title & Ultra-Wide Resolution Tag -->
      <rect x="80" y="80" width="135" height="11" rx="2" fill="#1e293b" />
      <line x1="88" y1="85.5" x2="160" y2="85.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="168" cy="85.5" r="1.5" fill="#0284c7" />

      <!-- Ultra-Wide 34" Curved Badge -->
      <rect x="525" y="78" width="76" height="11" rx="2" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.5" />
      <line x1="533" y1="83.5" x2="575" y2="83.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

      <!-- Ultra-Wide Work Content: Multi-Window Workspace (Layout Canvas + 3D Viewport + Spec Inspector) -->
      <!-- Left Tool Palette -->
      <rect x="36" y="104" width="28" height="205" rx="3" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="0.75" />
      <rect x="42" y="112" width="16" height="16" rx="2" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.75" />
      <rect x="44" y="136" width="12" height="12" rx="2" fill="#1e293b" />
      <rect x="44" y="156" width="12" height="12" rx="2" fill="#1e293b" />
      <rect x="44" y="176" width="12" height="12" rx="2" fill="#1e293b" />
      <rect x="44" y="196" width="12" height="12" rx="2" fill="#1e293b" />

      <!-- Main Canvas Window 01: 2D Floorplan Drafting Wireframe -->
      <g id="screen-cad-canvas">
        <rect x="74" y="118" width="285" height="188" rx="3" fill="#060e20" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.8" />
        
        <!-- Dimension Line -->
        <line x1="90" y1="128" x2="340" y2="128" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="3,3" stroke-opacity="0.7" />
        <circle cx="215" cy="128" r="2" fill="#38bdf8" />

        <!-- Desk Pod Cluster Vector -->
        <rect x="100" y="142" width="105" height="54" rx="2" fill="#0b1739" stroke="#0284c7" stroke-width="1" />
        <rect x="108" y="149" width="89" height="40" rx="1.5" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.75" />
        <!-- Chairs -->
        <circle cx="152" cy="214" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <line x1="144" y1="214" x2="160" y2="214" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />

        <!-- Executive Sit-Stand Desk 02 -->
        <rect x="230" y="142" width="105" height="54" rx="2" fill="#0b1739" stroke="#0284c7" stroke-width="1" />
        <rect x="238" y="149" width="89" height="40" rx="1.5" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.75" />
        <!-- Chair -->
        <circle cx="282" cy="214" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
        <line x1="274" y1="214" x2="290" y2="214" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />

        <!-- Acoustic Pod Outline -->
        <rect x="110" y="244" width="215" height="44" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="0.8" stroke-dasharray="3,2" />
        <line x1="130" y1="266" x2="305" y2="266" stroke="#334155" stroke-width="1.2" />
        <circle cx="217" cy="266" r="3.5" fill="#0284c7" fill-opacity="0.6" />

        <!-- Selection Box with Handles -->
        <rect x="94" y="136" width="117" height="92" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
        <rect x="91" y="133" width="5" height="5" fill="#38bdf8" />
        <rect x="208" y="133" width="5" height="5" fill="#38bdf8" />
        <rect x="91" y="225" width="5" height="5" fill="#38bdf8" />
        <rect x="208" y="225" width="5" height="5" fill="#38bdf8" />
      </g>

      <!-- Multi-Window 02: 3D Spatial Ortho Viewport (Benefiting from Ultra-Wide Screen Real Estate) -->
      <g id="screen-cad-3d-view">
        <rect x="368" y="118" width="175" height="188" rx="3" fill="#070d1e" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.8" />
        
        <!-- Viewport Header -->
        <rect x="368" y="118" width="175" height="16" rx="2" fill="#0f172a" />
        <line x1="376" y1="126" x2="416" y2="126" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="530" cy="126" r="2.5" fill="#10b981" />

        <!-- Isometric Spatial Wireframe Render -->
        <polygon points="455,145 520,175 455,205 390,175" fill="#0b1739" fill-opacity="0.6" stroke="#0284c7" stroke-width="1" />
        <polygon points="390,175 455,205 455,255 390,225" fill="#081026" stroke="#0284c7" stroke-width="0.8" />
        <polygon points="520,175 455,205 455,255 520,225" fill="#0d1b40" stroke="#0284c7" stroke-width="0.8" />

        <!-- Curved Coordinate Gizmo in corner -->
        <line x1="384" y1="288" x2="384" y2="268" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" />
        <line x1="384" y1="288" x2="402" y2="288" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
        <line x1="384" y1="288" x2="374" y2="296" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Right Inspector Panel -->
      <g id="screen-inspector">
        <rect x="550" y="104" width="55" height="205" rx="3" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="0.75" />
        <line x1="558" y1="116" x2="596" y2="116" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
        <rect x="556" y="126" width="43" height="12" rx="1.5" fill="#1e293b" />
        <line x1="562" y1="132" x2="588" y2="132" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
        <rect x="556" y="144" width="43" height="12" rx="1.5" fill="#1e293b" />
        <rect x="556" y="162" width="43" height="42" rx="2" fill="#070e1c" stroke="#1e293b" stroke-width="0.5" />
      </g>

      <!-- Parabolic Curvature Sheen Reflections (Left and Right curved screen highlights) -->
      <polygon points="26,70 140,84 90,328 26,322" fill="url(#curve-reflection-left)" />
      <polygon points="614,70 500,84 550,328 614,322" fill="url(#curve-reflection-right)" />
    </g>
  </g>

  <!-- 4. Top Integrated Center Sensor & WebCam Array -->
  <g id="curve-webcam-sensor">
    <!-- Camera Housing Pill (Centered along the apex of the curve) -->
    <rect x="302" y="70" width="36" height="7.5" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.75" />
    <!-- Camera Lens with Blue Optical Coating -->
    <circle cx="315" cy="73.8" r="1.8" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
    <circle cx="315" cy="73.8" r="0.8" fill="#0284c7" />
    <!-- Ambient Light Sensor & Micro Green Status Dot -->
    <circle cx="325" cy="73.8" r="0.9" fill="#10b981" />
  </g>
</svg>