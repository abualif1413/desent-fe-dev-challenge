<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft floor shadow gradient -->
    <radialGradient id="table-drop-shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Sleek wood / tabletop surface gradient -->
    <linearGradient id="tabletop-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Front edge beveled highlight -->
    <linearGradient id="tabletop-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Leg gradient (metallic architectural finish) -->
    <linearGradient id="metal-leg-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="35%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <linearGradient id="metal-leg-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Back leg gradient (shadowed for depth) -->
    <linearGradient id="back-leg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Subtle accent line -->
    <linearGradient id="primary-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Ground Plane Contact Shadows -->
  <ellipse cx="300" cy="392" rx="240" ry="24" fill="url(#table-drop-shadow)" />
  <ellipse cx="112" cy="388" rx="20" ry="6" fill="#0f172a" fill-opacity="0.22" />
  <ellipse cx="488" cy="388" rx="20" ry="6" fill="#0f172a" fill-opacity="0.22" />
  <ellipse cx="152" cy="365" rx="14" ry="4" fill="#0f172a" fill-opacity="0.14" />
  <ellipse cx="448" cy="365" rx="14" ry="4" fill="#0f172a" fill-opacity="0.14" />

  <!-- Back Left Leg (recessed for 3D depth) -->
  <g id="back-left-leg">
    <!-- Leg beam -->
    <polygon points="144,185 160,185 156,365 146,365" fill="url(#back-leg)" />
    <!-- Foot pad -->
    <rect x="144" y="363" width="14" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Back Right Leg (recessed for 3D depth) -->
  <g id="back-right-leg">
    <!-- Leg beam -->
    <polygon points="440,185 456,185 454,365 444,365" fill="url(#back-leg)" />
    <!-- Foot pad -->
    <rect x="442" y="363" width="14" height="4" rx="2" fill="#475569" />
  </g>

  <!-- Under-desk Support Apron / Structural Cable Trough -->
  <path d="M 120 188 L 480 188 L 472 208 L 128 208 Z" fill="#334155" />
  <!-- Under-apron shadow -->
  <rect x="126" y="204" width="348" height="4" fill="#0f172a" fill-opacity="0.3" />

  <!-- Front Left Leg -->
  <g id="front-left-leg">
    <!-- Upper mounting bracket -->
    <rect x="98" y="184" width="28" height="6" rx="1" fill="#1e293b" />
    <!-- Tapered modern architectural leg -->
    <polygon points="102,188 122,188 118,386 104,386" fill="url(#metal-leg-left)" stroke="#0f172a" stroke-opacity="0.1" stroke-width="0.5" />
    <!-- Leg highlight line -->
    <line x1="110" y1="190" x2="109" y2="384" stroke="#f8fafc" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <!-- Adjustable leveling foot glider -->
    <rect x="101" y="384" width="20" height="5" rx="2.5" fill="#0f172a" />
    <rect x="103" y="383" width="16" height="2" fill="#64748b" />
  </g>

  <!-- Front Right Leg -->
  <g id="front-right-leg">
    <!-- Upper mounting bracket -->
    <rect x="474" y="184" width="28" height="6" rx="1" fill="#1e293b" />
    <!-- Tapered modern architectural leg -->
    <polygon points="478,188 498,188 496,386 482,386" fill="url(#metal-leg-right)" stroke="#0f172a" stroke-opacity="0.1" stroke-width="0.5" />
    <!-- Leg highlight line -->
    <line x1="486" y1="190" x2="487" y2="384" stroke="#f8fafc" stroke-opacity="0.4" stroke-width="1.5" stroke-linecap="round" />
    <!-- Adjustable leveling foot glider -->
    <rect x="479" y="384" width="20" height="5" rx="2.5" fill="#0f172a" />
    <rect x="481" y="383" width="16" height="2" fill="#64748b" />
  </g>

  <!-- Tabletop Structure (Direct Front Perspective with Slight Top Reveal) -->
  <g id="tabletop">
    <!-- Tabletop Top Surface (slightly tilted forward perspective: 140px to 175px) -->
    <path d="M 64 148 C 64 142, 69 138, 76 138 L 524 138 C 531 138, 536 142, 536 148 L 548 175 C 550 178, 548 182, 543 182 L 57 182 C 52 182, 50 178, 52 175 Z"
          fill="url(#tabletop-surface)"
          stroke="#cbd5e1"
          stroke-width="1.5" />

    <!-- Tabletop Surface Subtle Chamfer Highlight -->
    <path d="M 76 140 L 524 140 L 543 174 L 57 174 Z"
          fill="#ffffff"
          fill-opacity="0.6" />

    <!-- Technical Wire / Cable Management Grommet in center rear -->
    <ellipse cx="300" cy="148" rx="18" ry="4.5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" />
    <ellipse cx="300" cy="148" rx="12" ry="2.5" fill="#475569" />

    <!-- Front Edge Face (Thickness / Bevel profile) -->
    <path d="M 52 175 C 50 178, 51 183, 55 186 L 56 195 C 57 199, 61 202, 66 202 L 534 202 C 539 202, 543 199, 544 195 L 545 186 C 549 183, 550 178, 548 175 Z"
          fill="url(#tabletop-edge)"
          stroke="#94a3b8"
          stroke-width="1" />

    <!-- Front Edge Top Crisp Specular Highlight -->
    <line x1="56" y1="183" x2="544" y2="183" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Front Bottom Lip Shadow Line -->
    <line x1="66" y1="201" x2="534" y2="201" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" />

    <!-- Design System Subtle Accent Strip (Cyan precision stripe along front edge) -->
    <rect x="220" y="191" width="160" height="2.5" rx="1.25" fill="url(#primary-accent)" />
  </g>
</svg>
