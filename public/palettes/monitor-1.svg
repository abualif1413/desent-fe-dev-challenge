<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft ground drop shadow -->
    <radialGradient id="monitor-ground-shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Brushed Aluminum / Anodized Light Alloy Frame Gradient -->
    <linearGradient id="metal-stand-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Base Plate Top Surface Gradient -->
    <linearGradient id="base-plate-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Base Chamfer Front Lip Gradient -->
    <linearGradient id="base-plate-lip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Display Bezel Gradient -->
    <linearGradient id="bezel-frame-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="10%" stop-color="#1e293b" />
      <stop offset="90%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- UHD Anti-Glare Screen Surface Gradient with subtle studio gradient -->
    <linearGradient id="screen-display-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#090e1a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Subtle Architectural Screen Reflection Sheen -->
    <linearGradient id="screen-glare-reflection" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Signature Precision Cyan Accent Glow (matches the desk and chair accents) -->
    <linearGradient id="cyan-precision-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Soundbar / Speaker Grille Micro-Perforation Pattern -->
    <pattern id="grille-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.65" fill="#475569" fill-opacity="0.6" />
    </pattern>

    <!-- Precision CAD / Grid Lines Overlay for UHD Work Display -->
    <pattern id="cad-grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-opacity="0.12" />
      <circle cx="20" cy="20" r="0.8" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- 1. Ground Plane Contact Shadow -->
  <ellipse cx="300" cy="460" rx="170" ry="16" fill="url(#monitor-ground-shadow)" />
  <ellipse cx="300" cy="458" rx="100" ry="7" fill="#0f172a" fill-opacity="0.18" />
  <ellipse cx="300" cy="457" rx="70" ry="4" fill="#0f172a" fill-opacity="0.25" />

  <!-- 2. Ergonomic Articulated Stand Assembly -->
  <!-- Base Stand Plate (Sleek low-profile beveled rectangular architectural plate) -->
  <g id="stand-base">
    <!-- Base Plate Lower Shadow Lip -->
    <path d="M 215 454 L 385 454 C 388 454, 391 452, 392 449 L 392 446 C 392 444, 389 443, 386 443 L 214 443 C 211 443, 208 444, 208 446 L 208 449 C 209 452, 212 454, 215 454 Z"
          fill="url(#base-plate-lip)" stroke="#64748b" stroke-width="0.75" />

    <!-- Base Plate Top Surface (Sleek tapered polygon) -->
    <polygon points="222,434 378,434 391,446 209,446"
             fill="url(#base-plate-surface)" stroke="#94a3b8" stroke-width="0.75" />

    <!-- Top Surface Specular Chamfer Highlight Line -->
    <line x1="223" y1="435" x2="377" y2="435" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />
    <!-- Front Bevel Specular Rim -->
    <line x1="210" y1="446" x2="390" y2="446" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

    <!-- Integrated Wireless Charging / Accessory Tray Subtle Recess -->
    <rect x="260" y="437" width="80" height="6" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="0.5" fill-opacity="0.6" />
    <!-- Micro Cyan Alignment Notch -->
    <circle cx="300" cy="440" r="1.2" fill="#0284c7" />
  </g>

  <!-- Heavy-Duty Brushed Aluminum Vertical Riser Column -->
  <g id="stand-column">
    <!-- Main Upright Shaft -->
    <rect x="282" y="220" width="36" height="216" rx="3" fill="url(#metal-stand-gradient)" stroke="#94a3b8" stroke-width="0.8" />

    <!-- Center Specular Highlight Line -->
    <line x1="300" y1="222" x2="300" y2="432" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- Left shadow line for cylindrical depth -->
    <line x1="285" y1="221" x2="285" y2="433" stroke="#64748b" stroke-width="1" stroke-opacity="0.5" />

    <!-- Precision Height Adjustment Ruler Markings (Technical studio detail) -->
    <line x1="290" y1="360" x2="295" y2="360" stroke="#64748b" stroke-width="0.75" />
    <line x1="288" y1="370" x2="295" y2="370" stroke="#64748b" stroke-width="0.75" />
    <line x1="290" y1="380" x2="295" y2="380" stroke="#64748b" stroke-width="0.75" />
    <line x1="287" y1="390" x2="295" y2="390" stroke="#0284c7" stroke-width="1" />
    <line x1="290" y1="400" x2="295" y2="400" stroke="#64748b" stroke-width="0.75" />

    <!-- Cable Management Pass-Through Grommet (Recessed ellipse) -->
    <ellipse cx="300" cy="320" rx="9" ry="16" fill="#475569" stroke="#334155" stroke-width="1" />
    <ellipse cx="300" cy="320" rx="7" ry="14" fill="#0f172a" />
    <!-- Cable channel inner shadow -->
    <path d="M 293 320 C 293 310, 307 310, 307 320" stroke="#1e293b" stroke-width="1.5" fill="none" />

    <!-- VESA / Height Pivot Articulation Collar behind monitor -->
    <rect x="276" y="226" width="48" height="18" rx="2" fill="#64748b" stroke="#475569" stroke-width="0.75" />
    <circle cx="282" cy="235" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" />
    <circle cx="318" cy="235" r="2.5" fill="#cbd5e1" stroke="#334155" stroke-width="0.5" />
  </g>

  <!-- 3. UHD Professional Work Display Screen -->
  <!-- Outer Chassis / Zero-Bezel Frame -->
  <g id="display-chassis">
    <!-- Outer Housing with Rounded Corners -->
    <rect x="40" y="50" width="520" height="310" rx="8" fill="url(#bezel-frame-gradient)" stroke="#64748b" stroke-width="1.5" />

    <!-- Ultra-Thin Top and Side Bezel Specular Edge Highlight -->
    <rect x="41" y="51" width="518" height="308" rx="7" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- Bottom Chin Bar (Architectural Anodized Silver Trim matching stand) -->
    <path d="M 40 338 L 560 338 L 560 352 C 560 356.4 556.4 360 552 360 L 48 360 C 43.6 360 40 356.4 40 352 Z"
          fill="url(#metal-stand-gradient)" stroke="#64748b" stroke-width="0.75" />

    <!-- Chin Bar Top Edge Crisp Specular Line -->
    <line x1="41" y1="339" x2="559" y2="339" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />

    <!-- Signature Precision Cyan Status LED & Accent Strip on Bottom Chin -->
    <rect x="240" y="347" width="120" height="2" rx="1" fill="url(#cyan-precision-accent)" />
    <!-- Power / Status Indicator Dot in Active Cyan -->
    <circle cx="536" cy="349" r="1.75" fill="#38bdf8" />
    <circle cx="536" cy="349" r="3.5" fill="#38bdf8" fill-opacity="0.25" />

    <!-- Discrete Front Stereo Micro-Grille on Chin Bar -->
    <rect x="80" y="346" width="90" height="4" fill="url(#grille-pattern)" />
    <rect x="430" y="346" width="90" height="4" fill="url(#grille-pattern)" />
  </g>

  <!-- UHD Anti-Glare Active Display Area -->
  <g id="active-display">
    <!-- 16:9 Work Surface (Matte Deep Slate / Obsidian) -->
    <rect x="48" y="58" width="504" height="280" rx="3" fill="url(#screen-display-gradient)" stroke="#090d16" stroke-width="1" />

    <!-- Architectural CAD Drafting UI on Screen (Subtle Precision Work Context) -->
    <!-- Blueprint / Isometric Precision Grid -->
    <rect x="48" y="58" width="504" height="280" fill="url(#cad-grid-pattern)" />

    <!-- Screen UI Header / Studio Bar -->
    <rect x="48" y="58" width="504" height="22" fill="#0f172a" fill-opacity="0.85" />
    <line x1="48" y1="80" x2="552" y2="80" stroke="#1e293b" stroke-width="0.75" />

    <!-- Window Traffic Control Pills -->
    <circle cx="62" cy="69" r="3" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="72" cy="69" r="3" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="82" cy="69" r="3" fill="#10b981" fill-opacity="0.8" />

    <!-- Document Title Chip -->
    <rect x="100" y="64" width="125" height="10" rx="2" fill="#1e293b" />
    <line x1="108" y1="69" x2="160" y2="69" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="168" cy="69" r="1.5" fill="#0284c7" />

    <!-- UHD Resolution Badge & Status -->
    <rect x="480" y="64" width="58" height="10" rx="2" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="0.5" />
    <line x1="488" y1="69" x2="518" y2="69" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Screen Center Work Artifact: Precision Architectural Floorplan Wireframe -->
    <g id="screen-cad-schematic">
      <!-- Main Workspace Canvas Area -->
      <rect x="140" y="105" width="320" height="185" rx="3" fill="#060e20" fill-opacity="0.75" stroke="#1e293b" stroke-width="1" />

      <!-- Dimension Guidelines -->
      <line x1="140" y1="98" x2="460" y2="98" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.6" stroke-dasharray="3,3" />
      <line x1="140" y1="95" x2="140" y2="101" stroke="#38bdf8" stroke-width="1" />
      <line x1="460" y1="95" x2="460" y2="101" stroke="#38bdf8" stroke-width="1" />
      <circle cx="300" cy="98" r="2" fill="#38bdf8" />

      <!-- Architectural Layout Vectors on Screen -->
      <!-- Desk 01 Vector Block -->
      <rect x="165" y="125" width="110" height="60" rx="2" fill="#0b1739" stroke="#0284c7" stroke-width="1.2" />
      <rect x="175" y="133" width="90" height="44" rx="1.5" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.75" />
      <!-- Chair Vector -->
      <circle cx="220" cy="205" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <line x1="210" y1="205" x2="230" y2="205" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

      <!-- Desk 02 Vector Block -->
      <rect x="325" y="125" width="110" height="60" rx="2" fill="#0b1739" stroke="#0284c7" stroke-width="1.2" />
      <rect x="335" y="133" width="90" height="44" rx="1.5" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="0.75" />
      <!-- Chair Vector -->
      <circle cx="380" cy="205" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <line x1="370" y1="205" x2="390" y2="205" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

      <!-- Acoustic Meeting Pod Outline -->
      <rect x="195" y="240" width="210" height="36" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2" />
      <line x1="210" y1="258" x2="390" y2="258" stroke="#334155" stroke-width="1.5" />
      <circle cx="300" cy="258" r="4" fill="#0284c7" fill-opacity="0.5" />

      <!-- Precision Selection Bounding Box with handles -->
      <rect x="160" y="120" width="120" height="100" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2,2" />
      <rect x="157" y="117" width="6" height="6" fill="#38bdf8" />
      <rect x="277" y="117" width="6" height="6" fill="#38bdf8" />
      <rect x="157" y="217" width="6" height="6" fill="#38bdf8" />
      <rect x="277" y="217" width="6" height="6" fill="#38bdf8" />
    </g>

    <!-- Side Tool Palette on Display Screen -->
    <rect x="58" y="90" width="26" height="230" rx="3" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.75" />
    <rect x="63" y="98" width="16" height="16" rx="2" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.75" />
    <rect x="65" y="122" width="12" height="12" rx="2" fill="#1e293b" />
    <rect x="65" y="142" width="12" height="12" rx="2" fill="#1e293b" />
    <rect x="65" y="162" width="12" height="12" rx="2" fill="#1e293b" />
    <rect x="65" y="182" width="12" height="12" rx="2" fill="#1e293b" />

    <!-- Right Property Inspector on Display Screen -->
    <rect x="475" y="90" width="67" height="230" rx="3" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="0.75" />
    <line x1="483" y1="102" x2="525" y2="102" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <rect x="483" y="114" width="51" height="14" rx="2" fill="#1e293b" />
    <line x1="489" y1="121" x2="515" y2="121" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" />
    <rect x="483" y="136" width="51" height="14" rx="2" fill="#1e293b" />
    <rect x="483" y="158" width="51" height="40" rx="2" fill="#0b1326" stroke="#1e293b" stroke-width="0.5" />

    <!-- Subtle Diagonal Ambient Screen Sheen Reflection -->
    <polygon points="48,58 240,58 110,338 48,338" fill="url(#screen-glare-reflection)" />
  </g>

  <!-- 4. Top Integrated Ambient WebCam / Sensor Array Bar -->
  <g id="webcam-sensor">
    <!-- Camera Housing Pill Notch -->
    <rect x="282" y="47" width="36" height="7" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.75" />
    <!-- Camera Lens with Optical Highlight -->
    <circle cx="295" cy="50.5" r="1.8" fill="#1e293b" stroke="#334155" stroke-width="0.5" />
    <circle cx="295" cy="50.5" r="0.8" fill="#0284c7" />
    <!-- Ambient Light Sensor & Micro-LED indicator -->
    <circle cx="305" cy="50.5" r="0.9" fill="#10b981" />
  </g>
</svg>