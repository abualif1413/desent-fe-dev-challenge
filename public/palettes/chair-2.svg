<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft ground plane drop shadow for light theme -->
    <radialGradient id="chair-light-shadow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Brushed Aluminum / Light Architectural Frame Gradient -->
    <linearGradient id="frame-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Chrome Gas Lift Shaft Gradient -->
    <linearGradient id="gas-lift-chrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Light Translucent Silver/Grey Mesh Backrest Gradient -->
    <linearGradient id="mesh-light-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f1f5f9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.95" />
    </linearGradient>

    <!-- Light Seat Cushion Contour Gradient -->
    <linearGradient id="seat-light-cushion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Armrest Pad Gradient (Crisp off-white / light slate soft elastomer) -->
    <linearGradient id="armpad-light-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Headrest Light Cushion Gradient -->
    <linearGradient id="headrest-light-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Cyan Precision Technical Accent Strip (matching light desk {{DATA:IMAGE:IMAGE_6}} accent) -->
    <linearGradient id="cyan-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.6" />
    </linearGradient>

    <!-- Caster Hub Metallic Gradient -->
    <linearGradient id="caster-metal-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Light Technical Mesh Micro-Pattern -->
    <pattern id="mesh-light-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 0 4 L 4 0 L 8 4 L 4 8 Z" fill="none" stroke="#94a3b8" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="4" cy="4" r="0.75" fill="#0284c7" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- 1. Ground Plane Contact Shadows -->
  <ellipse cx="300" cy="545" rx="190" ry="20" fill="url(#chair-light-shadow)" />
  <ellipse cx="300" cy="542" rx="70" ry="8" fill="#0f172a" fill-opacity="0.18" />

  <!-- Caster contact spots -->
  <ellipse cx="140" cy="535" rx="14" ry="4" fill="#0f172a" fill-opacity="0.25" />
  <ellipse cx="460" cy="535" rx="14" ry="4" fill="#0f172a" fill-opacity="0.25" />
  <ellipse cx="230" cy="542" rx="12" ry="3.5" fill="#0f172a" fill-opacity="0.2" />
  <ellipse cx="370" cy="542" rx="12" ry="3.5" fill="#0f172a" fill-opacity="0.2" />

  <!-- 2. 5-Star Base & Caster Wheels (Front Elevation) -->
  <g id="star-base">
    <!-- Center Hub in Brushed Aluminum -->
    <rect x="286" y="475" width="28" height="24" rx="4" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="0.75" />
    <rect x="288" y="477" width="24" height="20" rx="3" fill="#f1f5f9" fill-opacity="0.5" />
    
    <!-- Left outer leg -->
    <path d="M 288 488 L 146 524 C 142 525, 138 528, 138 532 L 138 534 L 152 534 L 288 497 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="0.75" />
    <line x1="288" y1="489" x2="142" y2="526" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right outer leg -->
    <path d="M 312 488 L 454 524 C 458 525, 462 528, 462 532 L 462 534 L 448 534 L 312 497 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="0.75" />
    <line x1="312" y1="489" x2="458" y2="526" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Front Left leg -->
    <path d="M 292 494 L 234 532 C 231 534, 228 536, 226 539 L 240 541 L 296 500 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="0.75" />
    <line x1="293" y1="495" x2="232" y2="534" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />

    <!-- Front Right leg -->
    <path d="M 308 494 L 366 532 C 369 534, 372 536, 374 539 L 360 541 L 304 500 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="0.75" />
    <line x1="307" y1="495" x2="368" y2="534" stroke="#ffffff" stroke-width="1.25" stroke-linecap="round" />

    <!-- Dual-wheel architectural casters (crisp light slate & chrome hubs) -->
    <!-- Far Left Caster -->
    <g id="caster-left">
      <rect x="134" y="528" width="12" height="9" rx="2" fill="#475569" stroke="#334155" stroke-width="0.5" />
      <circle cx="140" cy="534" r="5" fill="url(#caster-metal-light)" stroke="#475569" stroke-width="0.75" />
      <circle cx="140" cy="534" r="2" fill="#ffffff" />
    </g>

    <!-- Far Right Caster -->
    <g id="caster-right">
      <rect x="454" y="528" width="12" height="9" rx="2" fill="#475569" stroke="#334155" stroke-width="0.5" />
      <circle cx="460" cy="534" r="5" fill="url(#caster-metal-light)" stroke="#475569" stroke-width="0.75" />
      <circle cx="460" cy="534" r="2" fill="#ffffff" />
    </g>

    <!-- Front Mid-Left Caster -->
    <g id="caster-mid-left">
      <circle cx="232" cy="540" r="5" fill="url(#caster-metal-light)" stroke="#475569" stroke-width="0.75" />
      <circle cx="232" cy="540" r="2" fill="#ffffff" />
    </g>

    <!-- Front Mid-Right Caster -->
    <g id="caster-mid-right">
      <circle cx="368" cy="540" r="5" fill="url(#caster-metal-light)" stroke="#475569" stroke-width="0.75" />
      <circle cx="368" cy="540" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- 3. Pneumatic Gas Lift Column & Tilt Mechanism -->
  <g id="gas-lift-column">
    <!-- Outer telescoping sleeve in silver/slate -->
    <rect x="290" y="445" width="20" height="35" rx="2" fill="#64748b" stroke="#475569" stroke-width="0.75" />
    <rect x="293" y="446" width="4" height="33" fill="#94a3b8" />
    <!-- Polished chrome inner shaft -->
    <rect x="293" y="415" width="14" height="35" fill="url(#gas-lift-chrome)" stroke="#64748b" stroke-width="0.5" />
    <!-- Under-seat mechanism housing -->
    <path d="M 265 398 L 335 398 L 328 418 L 272 418 Z" fill="#475569" stroke="#334155" stroke-width="0.75" />
    <!-- Tilt tension knob -->
    <rect x="292" y="416" width="16" height="8" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75" />
    <!-- Control levers left & right with cyan indicators -->
    <rect x="250" y="405" width="18" height="4" rx="2" fill="#94a3b8" />
    <rect x="332" y="405" width="18" height="4" rx="2" fill="#94a3b8" />
    <circle cx="253" cy="407" r="1.25" fill="#0284c7" />
    <circle cx="347" cy="407" r="1.25" fill="#0284c7" />
  </g>

  <!-- 4. Armrest Structural Supports (Behind seat layer) -->
  <g id="armrest-supports">
    <!-- Left structural upright -->
    <path d="M 238 396 L 202 388 C 196 386, 192 380, 192 374 L 192 285 L 204 285 L 204 368 L 238 384 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="1" />
    <!-- Specular highlight bevel on left stem -->
    <line x1="195" y1="288" x2="195" y2="370" stroke="#ffffff" stroke-width="1.25" />
    <!-- Left height adjustment release trigger in cyan -->
    <rect x="189" y="300" width="4" height="12" rx="1.5" fill="#0284c7" />

    <!-- Right structural upright -->
    <path d="M 362 396 L 398 388 C 404 386, 408 380, 408 374 L 408 285 L 396 285 L 396 368 L 362 384 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="1" />
    <!-- Specular highlight bevel on right stem -->
    <line x1="405" y1="288" x2="405" y2="370" stroke="#ffffff" stroke-width="1.25" />
    <!-- Right height adjustment release trigger in cyan -->
    <rect x="407" y="300" width="4" height="12" rx="1.5" fill="#0284c7" />
  </g>

  <!-- 5. Ergonomic Backrest Assembly (Spine, Lumbar & Light Translucent Mesh) -->
  <g id="backrest">
    <!-- Central Ergonomic Y-Spine (Light architectural composite silver finish) -->
    <path d="M 294 395 L 306 395 L 308 220 L 330 155 L 318 150 L 300 195 L 282 150 L 270 155 L 292 220 Z" fill="#94a3b8" stroke="#64748b" stroke-width="0.75" />
    <!-- Spine center specular line -->
    <line x1="300" y1="220" x2="300" y2="390" stroke="#ffffff" stroke-width="1.5" />

    <!-- Lumbar Support System (Cradle + Cyan Precision Glow Ribbon) -->
    <g id="lumbar-support">
      <!-- Lumbar structural cradle -->
      <path d="M 230 295 C 265 304, 335 304, 370 295 C 374 294, 376 298, 374 302 C 342 318, 258 318, 226 302 C 224 298, 226 294, 230 295 Z"
            fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" />
      <!-- Lumbar cushion pad front -->
      <path d="M 238 297 C 270 304, 330 304, 362 297 C 365 296, 367 299, 365 302 C 338 314, 262 314, 235 302 C 233 299, 235 296, 238 297 Z"
            fill="#e2e8f0" />
      <!-- Lumbar Cyan Precision Accent Glow Strip (matches the desk light cyan line) -->
      <path d="M 252 301 C 280 306, 320 306, 348 301" stroke="url(#cyan-accent-light)" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Outer Perimeter Structural Frame of Backrest (Clean architectural brushed alloy) -->
    <path d="M 240 145 C 270 135, 330 135, 360 145 C 385 154, 395 190, 390 240 C 385 285, 388 325, 376 365 C 372 376, 362 380, 350 380 C 320 382, 280 382, 250 380 C 238 380, 228 376, 224 365 C 212 325, 215 285, 210 240 C 205 190, 215 154, 240 145 Z"
          fill="url(#mesh-light-gradient)"
          stroke="#94a3b8"
          stroke-width="2.5" />

    <!-- Light Silver Mesh Micro-Pattern Overlay -->
    <path d="M 240 145 C 270 135, 330 135, 360 145 C 385 154, 395 190, 390 240 C 385 285, 388 325, 376 365 C 372 376, 362 380, 350 380 C 320 382, 280 382, 250 380 C 238 380, 228 376, 224 365 C 212 325, 215 285, 210 240 C 205 190, 215 154, 240 145 Z"
          fill="url(#mesh-light-pattern)" />

    <!-- Outer Perimeter Crisp Top Specular Highlight Arc -->
    <path d="M 244 148 C 272 139, 328 139, 356 148 C 378 156, 387 190, 382 240 C 378 282, 380 322, 369 360"
          stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 6. Waterfall Contoured Seat Pan -->
  <g id="seat-pan">
    <!-- Under-seat frame rim (anodized light graphite) -->
    <path d="M 195 382 C 195 374, 215 370, 300 370 C 385 370, 405 374, 405 382 L 400 405 C 400 412, 380 416, 300 416 C 220 416, 200 412, 200 405 Z"
          fill="#94a3b8" stroke="#64748b" stroke-width="0.75" />

    <!-- Lower rim / front edge drop shadow line -->
    <path d="M 194 382 C 196 395, 218 410, 300 410 C 382 410, 404 395, 406 382 C 408 396, 396 414, 300 414 C 204 414, 192 396, 194 382 Z"
          fill="#cbd5e1" />

    <!-- Top Cushion Surface with saddle contour (crisp off-white / light slate) -->
    <path d="M 198 372 C 212 365, 252 362, 300 362 C 348 362, 388 365, 402 372 C 414 378, 412 388, 398 396 C 374 408, 335 412, 300 412 C 265 412, 226 408, 202 396 C 188 388, 186 378, 198 372 Z"
          fill="url(#seat-light-cushion)"
          stroke="#94a3b8"
          stroke-width="1.5" />

    <!-- Cushion Ergonomic Saddle Relief Stitching Curves -->
    <path d="M 235 375 C 242 388, 246 398, 248 404" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M 236 375 C 243 388, 247 398, 249 404" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

    <path d="M 365 375 C 358 388, 354 398, 352 404" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <path d="M 364 375 C 357 388, 353 398, 351 404" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

    <!-- Front waterfall edge highlight rim -->
    <path d="M 215 397 C 248 407, 352 407, 385 397" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Subtle bottom lip line -->
    <path d="M 218 411 C 250 415, 350 415, 382 411" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- 7. 4D Armrest Cushion Pads (Foreground layer) -->
  <g id="armrest-pads">
    <!-- Left Armrest Pad -->
    <g id="armpad-left">
      <ellipse cx="198" cy="282" rx="26" ry="9" fill="url(#armpad-light-gradient)" stroke="#94a3b8" stroke-width="1.25" />
      <!-- Bevel Specular Top Highlight -->
      <ellipse cx="198" cy="281" rx="22" ry="6" fill="none" stroke="#ffffff" stroke-width="1.2" />
      <!-- Tactile Inner Indentation -->
      <ellipse cx="198" cy="282" rx="14" ry="3.5" fill="#f1f5f9" />
    </g>

    <!-- Right Armrest Pad -->
    <g id="armpad-right">
      <ellipse cx="402" cy="282" rx="26" ry="9" fill="url(#armpad-light-gradient)" stroke="#94a3b8" stroke-width="1.25" />
      <!-- Bevel Specular Top Highlight -->
      <ellipse cx="402" cy="281" rx="22" ry="6" fill="none" stroke="#ffffff" stroke-width="1.2" />
      <!-- Tactile Inner Indentation -->
      <ellipse cx="402" cy="282" rx="14" ry="3.5" fill="#f1f5f9" />
    </g>
  </g>

  <!-- 8. Articulated Ergonomic Headrest Assembly -->
  <g id="headrest">
    <!-- Dual-pivot Mounting Bracket Extension in brushed aluminum -->
    <path d="M 292 142 L 292 98 L 308 98 L 308 142 Z" fill="url(#frame-light)" stroke="#94a3b8" stroke-width="0.75" />
    <line x1="294" y1="102" x2="294" y2="138" stroke="#ffffff" stroke-width="1" />
    
    <!-- Articulation Pivot Joints with Specular Highlights -->
    <circle cx="295" cy="102" r="4.5" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75" />
    <circle cx="295" cy="102" r="2" fill="#ffffff" />
    <circle cx="305" cy="102" r="4.5" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75" />
    <circle cx="305" cy="102" r="2" fill="#ffffff" />

    <!-- Headrest Cushion (Concave Cervical Spine Contour in Crisp Light Materials) -->
    <path d="M 245 84 C 265 92, 335 92, 355 84 C 365 80, 368 66, 358 60 C 338 48, 262 48, 242 60 C 232 66, 235 80, 245 84 Z"
          fill="url(#headrest-light-gradient)"
          stroke="#94a3b8"
          stroke-width="1.5" />

    <!-- Headrest Inner Concave Surface / Ergonomic Neck Cradle -->
    <path d="M 252 80 C 272 86, 328 86, 348 80 C 354 77, 356 67, 350 63 C 334 54, 266 54, 250 63 C 244 67, 246 77, 252 80 Z"
          fill="#f8fafc" />

    <!-- Headrest Top Specular Highlight Arc -->
    <path d="M 254 62 C 274 53, 326 53, 346 62" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <!-- Headrest Lower Lip Subtle Shadow -->
    <path d="M 248 83 C 270 90, 330 90, 352 83" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

    <!-- Cyan Micro-Accent Dot on pivot center -->
    <circle cx="300" cy="102" r="1.5" fill="#0284c7" />
  </g>
</svg>